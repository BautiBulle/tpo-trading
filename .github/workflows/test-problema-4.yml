name: Pruebas Problema 4

on:
  push:
    branches:
      - feature/problema-4
  pull_request:
    branches:
      - develop
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Probar cancelaciones sin bases
        run: python -m pytest tests/test_p4_cancelacion.py tests/test_p2_colocar_orden.py -v

      - name: Levantar bases para la integración P2 P3 P4
        run: docker compose up -d --wait --wait-timeout 240 postgres mongo redis cassandra

      - name: Inicializar Cassandra
        run: docker compose run --rm cassandra-init

      - name: Probar cancelaciones con bases temporales
        env:
          RUN_P4_INTEGRATION: "1"
        run: python -m pytest tests/test_integracion_p4.py -v

      - name: Mostrar logs si falla
        if: failure()
        run: docker compose logs --tail=80

      - name: Detener contenedores
        if: always()
        run: docker compose down

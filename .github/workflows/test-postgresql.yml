name: Pruebas PostgreSQL

on:
  push:
    branches:
      - feature/postgresql
  pull_request:
    branches:
      - develop

jobs:
  pruebas:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tpo
          POSTGRES_PASSWORD: tpo
          POSTGRES_DB: trading
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tpo -d trading"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PG_HOST: localhost
      PG_PORT: 5432
      PG_USER: tpo
      PG_PASSWORD: tpo
      PG_DB: trading

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Inicializar esquema PostgreSQL
        run: |
          PGPASSWORD="$PG_PASSWORD" psql \
            -h "$PG_HOST" \
            -p "$PG_PORT" \
            -U "$PG_USER" \
            -d "$PG_DB" \
            -f init/postgres.sql

      - name: Ejecutar pruebas de integración
        run: python -m pytest tests/test_integracion_postgresql.py -v

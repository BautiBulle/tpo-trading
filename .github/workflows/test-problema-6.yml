name: Pruebas Problema 6

on:
  push:
    branches:
      - feature/problema-6
  pull_request:
    branches:
      - develop
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Probar historial y rendimiento sin bases
        run: python -m pytest tests/test_p6_historial.py tests/test_historial_cass.py -v

      - name: Levantar MongoDB y Cassandra
        run: docker compose up -d --wait --wait-timeout 240 mongo cassandra

      - name: Inicializar Cassandra
        run: docker compose run --rm cassandra-init

      - name: Probar con historiales reales en bases temporales
        env:
          RUN_P6_INTEGRATION: "1"
        run: python -m pytest tests/test_integracion_p6.py -v

      - name: Mostrar logs si falla
        if: failure()
        run: docker compose logs --tail=80 mongo cassandra

      - name: Detener contenedores
        if: always()
        run: docker compose down

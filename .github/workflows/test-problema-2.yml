name: Pruebas Problema 2

on:
  push:
    branches:
      - feature/problema-2
  pull_request:
    branches:
      - develop

jobs:
  pruebas:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Ejecutar pruebas del Problema 2
        run: python -m pytest tests/test_p2_colocar_orden.py -v
